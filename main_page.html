<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapid Route R</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .headerstyle {
            background: white;
            border: 6px solid rgb(255, 255, 255);
            border-width: medium;
            font-family: "Boldonse", system-ui;
        }

        body {
            background: #ffa8a8;
            font-family: "Boldonse", system-ui;
            ;
            /* height of the screen */
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            /* rem is relative to font space */
            padding: 2rem 1.5rem;
            gap: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 1rem;
            border: none;
            /* border-radius: 10px; */
            font-size: 1rem;
            font-weight: 600;
            font-family: "Boldonse", system-ui;
            cursor: pointer;
            background: #ff0000;
            color: #fff;
            transition: opacity 0.2s;
            box-shadow: 10px 5px 5px rgb(106, 23, 23);
        }

        .btn:active {
            opacity: 0.75;
        }
    </style>

</head>

<body>
    <h1 class="headerstyle"> Rapid Route Railers </h1>
    <p> Bored? Want a third space to access? Click here! </p>
    <button class="btn" onclick="location.href='https://rapidrouterailers.s3.us-east-2.amazonaws.com/Fallout+Shelter.png'">Fallout Shelter</button>
    <button class="btn" onclick="location.href='https://rapidrouterailers.s3.us-east-2.amazonaws.com/Garment+District.png'">Garment District</button>
    <button class="btn" onclick="location.href='https://rapidrouterailers.s3.us-east-2.amazonaws.com/Isabella+Stewart+Gardner+Museum.png'">Gardner
        Museum</button>
    <button class="btn" onclick="location.href='https://rapidrouterailers.s3.us-east-2.amazonaws.com/Japan+Festival.png'">Japan Festival</button>
    <button class="btn" onclick="location.href='https://rapidrouterailers.s3.us-east-2.amazonaws.com/Embroidery+Workshop.png'">Embroidery
        Workshop</button>

</body>

</html>
